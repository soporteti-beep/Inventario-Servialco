name: Actualizar Inventario Automático

on:
  push:
    branches:
      - main
    paths:
      - 'bitacora.csv'

jobs:
  actualizar-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar script de actualización
        run: python actualizar.py

      # --- NUEVOS PASOS PARA GOOGLE DRIVE ---
      # Eliminamos el "git push" para no llenar tu Git.
      # Ahora, los archivos generados se envían directo a Drive.

      - name: Subir servialco.csv a Drive
        uses: adityak74/google-drive-upload-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: "Servialco/servialco.csv"
          folderId: "PEGA_AQUI_EL_ID_DE_TU_CARPETA"
          overwrite: "true"

      - name: Subir ays-servialco.csv a Drive
        uses: adityak74/google-drive-upload-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: "AYS-Servialco/ays-servialco.csv"
          folderId: "PEGA_AQUI_EL_ID_DE_TU_CARPETA"
          overwrite: "true"

      - name: Subir unicat.csv a Drive
        uses: adityak74/google-drive-upload-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: "UNICAT/unicat.csv"
          folderId: "PEGA_AQUI_EL_ID_DE_TU_CARPETA"
          overwrite: "true"

      - name: Subir arky.csv a Drive
        uses: adityak74/google-drive-upload-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: "ARKY/arky.csv"
          folderId: "PEGA_AQUI_EL_ID_DE_TU_CARPETA"
          overwrite: "true"
          
      - name: Subir bitacora.csv a Drive (Respaldo)
        uses: adityak74/google-drive-upload-action@main
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: "bitacora.csv"
          folderId: "PEGA_AQUI_EL_ID_DE_TU_CARPETA"
          overwrite: "true"
