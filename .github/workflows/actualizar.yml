name: Actualizar Inventario Automático

on:
  push:
    branches:
      - main
    paths:
      - 'bitacora.csv'

jobs:
  actualizar-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar script de actualización
        run: python actualizar.py

      - name: Guardar los módulos actualizados
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add Servialco/*.csv AYS-Servialco/*.csv UNICAT/*.csv ARKY/*.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de CSVs desde Bitácora" && git push)
