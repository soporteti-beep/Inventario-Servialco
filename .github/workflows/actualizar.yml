name: Actualizar Inventario Automático

on:
  push:
    branches:
      - main
    paths:
      - 'bitacora.csv'

# Una sola ejecución a la vez: las demás esperan en cola
concurrency:
  group: actualizar-inventario
  cancel-in-progress: false

jobs:
  actualizar-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruir inventarios desde la bitácora
        run: python py.py/procesar.py

      - name: Guardar inventarios en GitHub (para la web)
        if: ${{ !cancelled() }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add Servialco/*.csv AYS-Servialco/*.csv UNICAT/*.csv ARKY/*.csv
          if git diff --staged --quiet; then
            echo "Sin cambios en los inventarios"
          else
            git commit -m "🤖 Actualización automática de CSVs"
            git pull --rebase origin main
            git push
          fi

      - name: Sincronizar Bitácora con Excel (Google Sheets)
        if: ${{ !cancelled() }}
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          pip install gspread==5.12.4
          python py.py/actualizar_sheet.py
