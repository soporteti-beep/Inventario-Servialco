name: Actualizar Inventario Automático

on:
  push:
    branches:
      - main
    paths:
      - 'bitacora.csv' # El robot SOLO se activa si modificas la bitácora

jobs:
  actualizar-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Le damos permiso al robot para guardar cambios

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar script de actualización
        run: python actualizar.py

      - name: Guardar el inventario actualizado
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add inventario.csv
          # Solo hace commit si el script realmente modificó el inventario
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización automática de inventario" && git push)
