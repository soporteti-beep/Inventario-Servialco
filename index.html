<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Global de Inventario - Servialco</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root { --tema-color: #34495E; }
    </style>
</head>
<body>

    <!-- MENÚ DE NAVEGACIÓN ENTRE MÓDULOS -->
    <div class="nav-modules">
        <a href="index.html" class="active">📋 Todos los Equipos</a>
        <a href="Servialco/servialco.html">🏢 SERVIALCO</a>
        <a href="AYS-Servialco/ays-servialco.html">🏢 AYS</a>
        <a href="UNICAT/unicat.html">🏢 UNICAT</a>
        <a href="ARKY/arky.html">🏢 ARKY</a>
    </div>

    <div class="header">
        <div class="header-left">
            <img src="logo-servialco.png" alt="Logo" onerror="this.style.display='none'">
            <h1>Visor Global de Inventario (Consulta Unificada)</h1>
        </div>
    </div>

    <!-- FILTROS Y BÚSQUEDA -->
    <div class="search-container">
        <input type="text" id="buscador" class="buscador" onkeyup="filtrarTabla()" placeholder="Buscar equipo, monitor, serial o responsable...">
        <select id="filtro-estado" class="filtro-estado" onchange="filtrarTabla()">
            <option value="">Todos los Estados</option>
            <option value="ASIGNADO">Asignados</option>
            <option value="BODEGA">En Bodega</option>
            <option value="DEVUELTO">Devueltos a Proveedor</option>
            <option value="SOPORTE">En Soporte</option>
        </select>
    </div>

    <div class="tabs" id="tabs-container"></div>

    <!-- TABLAS DE CONSULTA -->
    <div id="sec-computadores" style="display:none;">
        <h2 class="titulo-seccion">💻 Computadores (Portátiles y Escritorio)</h2>
        <div style="overflow-x:auto;">
            <table>
                <thead><tr class="filas-cabecera"></tr></thead>
                <tbody id="cuerpo-computadores"></tbody>
            </table>
        </div>
    </div>

    <div id="sec-monitores" style="display:none;">
        <h2 class="titulo-seccion">📺 Monitores (Todos los Proveedores)</h2>
        <div style="overflow-x:auto;">
            <table>
                <thead><tr class="filas-cabecera"></tr></thead>
                <tbody id="cuerpo-monitores"></tbody>
            </table>
        </div>
    </div>

    <!-- MODAL DE CONSULTA DE HISTORIAL -->
    <div id="modalHistorial" class="modal">
        <div class="modal-content" style="width: 80%;">
            <div class="modal-header">Trazabilidad del Activo: <span id="historial-serial"></span></div>
            <div style="overflow-x:auto; max-height: 350px;">
                <table style="width:100%;">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Evento</th>
                            <th>Responsable</th>
                            <th>Ubicación</th>
                            <th>Estado</th>
                            <th>Observaciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-historial"></tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button class="btn-cancelar" onclick="cerrarHistorial()">Cerrar</button>
            </div>
        </div>
    </div>

    <script>
        let encabezadosGlobales = [];
        let datosGlobales = [];

        // Rutas a los CSV de todos los módulos
        const ARCHIVOS_CSV = [
            'Servialco/servialco.csv',
            'AYS-Servialco/ays-servialco.csv',
            'UNICAT/unicat.csv',
            'ARKY/arky.csv'
        ];

        window.onload = () => { cargarInventarioUnificado(); };

        async function cargarInventarioUnificado() {
            try {
                datosGlobales = [];
                let gruposUnicos = new Set();
                let cabeceraEstablecida = false;

                const timestamp = new Date().getTime();
                const respuestas = await Promise.all(
                    ARCHIVOS_CSV.map(url => fetch(`${url}?${timestamp}`).then(r => r.ok ? r.text() : ''))
                );

                respuestas.forEach(data => {
                    if (!data) return;
                    const filas = data.split('\n').filter(row => row.trim().length > 0);
                    if (filas.length === 0) return;

                    const separador = filas[0].includes(';') ? ';' : ',';
                    
                    if (!cabeceraEstablecida) {
                        encabezadosGlobales = filas[0].split(separador);
                        let htmlCabecera = '';
                        encabezadosGlobales.forEach(h => {
                            let nombreMostrar = h.toUpperCase().replace(/_/g, ' ');
                            htmlCabecera += `<th>${nombreMostrar}</th>`;
                        });
                        document.querySelectorAll('.filas-cabecera').forEach(el => el.innerHTML = htmlCabecera);
                        cabeceraEstablecida = true;
                    }

                    for (let i = 1; i < filas.length; i++) {
                        const columnas = filas[i].split(separador);
                        const proveedor = columnas[5] ? columnas[5].trim() : 'PROPIO';
                        const empresa = columnas[6] ? columnas[6].trim() : 'S/E';
                        const etiquetaGrupo = `${proveedor} - ${empresa}`;
                        
                        gruposUnicos.add(etiquetaGrupo);
                        datosGlobales.push({ data: columnas, grupo: etiquetaGrupo });
                    }
                });

                const tabsContainer = document.getElementById('tabs-container');
                tabsContainer.innerHTML = `<button class="tab-btn active" onclick="filtrarPorPestana('TODOS', this)">VISIÓN GLOBAL</button>`;
                
                Array.from(gruposUnicos).sort().forEach(grupo => {
                    if (grupo !== " - ") tabsContainer.innerHTML += `<button class="tab-btn" onclick="filtrarPorPestana('${grupo}', this)">${grupo}</button>`;
                });

                pintarTablas(datosGlobales);
                filtrarTabla();
            } catch (e) { console.error("Error unificando los inventarios", e); }
        }

        function pintarTablas(datos) {
            let htmlComps = '';
            let htmlMons = '';

            let idxEstado = encabezadosGlobales.indexOf('estado');
            let idxSerialOrig = encabezadosGlobales.indexOf('serial');
            let idxSerialProv = encabezadosGlobales.indexOf('serial_proveedor');
            let idxTipo = encabezadosGlobales.indexOf('tipo');

            datos.forEach(fila => {
                let celdas = fila.data;
                let estadoActual = idxEstado > -1 && celdas[idxEstado] ? celdas[idxEstado].trim().toUpperCase() : '';
                let valSerialOrig = idxSerialOrig > -1 && celdas[idxSerialOrig] ? celdas[idxSerialOrig].trim() : '';
                let valSerialProv = idxSerialProv > -1 && celdas[idxSerialProv] ? celdas[idxSerialProv].trim() : '';
                let tipoVal = idxTipo > -1 && celdas[idxTipo] ? celdas[idxTipo].trim().toUpperCase() : '';

                let esMonitor = tipoVal.includes('MONITOR') || tipoVal.includes('PANTALLA');

                let filaHtml = `<tr class="fila-dato ${esMonitor ? 'fila-monitor' : 'fila-comp'}" data-grupo="${fila.grupo}" data-estado="${estadoActual}">`;
                
                celdas.forEach((celda, index) => {
                    let contenido = celda || '';
                    if (index === idxEstado) {
                        let claseBadge = contenido === 'ASIGNADO' ? 'bg-asignado' : (contenido === 'BODEGA' ? 'bg-bodega' : 'bg-default');
                        contenido = `<span class="badge ${claseBadge}">${contenido}</span>`;
                    }
                    
                    if (index === idxSerialOrig) {
                        contenido = `<a href="javascript:void(0)" onclick="verHistorial('${valSerialOrig}', '${valSerialProv}')" style="color: inherit; font-weight: bold; text-decoration: underline;">${valSerialOrig}</a>`;
                    }
                    
                    filaHtml += `<td>${contenido}</td>`;
                });
                filaHtml += '</tr>';

                if (esMonitor) htmlMons += filaHtml;
                else htmlComps += filaHtml;
            });

            document.getElementById('cuerpo-computadores').innerHTML = htmlComps;
            document.getElementById('cuerpo-monitores').innerHTML = htmlMons;
        }

        function filtrarPorPestana(grupo, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById("buscador").value = '';
            document.getElementById("filtro-estado").value = '';
            filtrarTabla();
        }

        function filtrarTabla() {
            let filtroGlobal = document.getElementById("buscador").value.toUpperCase();
            let filtroEstado = document.getElementById("filtro-estado").value.toUpperCase();
            let grupoActivo = document.querySelector('.tab-btn.active').innerText;

            let countC = 0, countM = 0;

            document.querySelectorAll('.fila-dato').forEach(fila => {
                let coincidePestana = (grupoActivo.includes('TODOS') || grupoActivo.includes('GLOBAL') || fila.getAttribute('data-grupo') === grupoActivo);
                let coincideEstado = (filtroEstado === "" || fila.getAttribute('data-estado') === filtroEstado);
                let coincideGlobal = fila.innerText.toUpperCase().includes(filtroGlobal);
                
                if (coincidePestana && coincideEstado && coincideGlobal) {
                    fila.style.display = "";
                    if (fila.classList.contains('fila-comp')) countC++;
                    else if (fila.classList.contains('fila-monitor')) countM++;
                } else {
                    fila.style.display = "none";
                }
            });

            document.getElementById('sec-computadores').style.display = countC > 0 ? 'block' : 'none';
            document.getElementById('sec-monitores').style.display = countM > 0 ? 'block' : 'none';
        }

        function cerrarHistorial() { document.getElementById('modalHistorial').style.display = 'none'; }

        async function verHistorial(serialPrincipal, serialProv) {
            try {
                let tituloMostrar = serialProv ? `SERIAL AYS/PROV: ${serialProv} (Fábrica: ${serialPrincipal})` : serialPrincipal;
                document.getElementById('historial-serial').innerText = tituloMostrar;
                document.getElementById('cuerpo-historial').innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 20px;">Consultando bitácora... ⏳</td></tr>';
                document.getElementById('modalHistorial').style.display = 'block';

                const response = await fetch('bitacora.csv?' + new Date().getTime());
                const data = await response.text();
                const filas = data.split('\n').filter(row => row.trim().length > 0);
                
                let htmlHistorial = '';
                let hayRegistros = false;
                
                for(let i=1; i<filas.length; i++) {
                    let sep = filas[i].includes(';') ? ';' : ',';
                    let cols = filas[i].split(sep);
                    let colSerial = cols[1] ? cols[1].trim() : '';
                    
                    if(colSerial === serialPrincipal || (serialProv && colSerial === serialProv)) {
                        hayRegistros = true;
                        htmlHistorial += `<tr style="border-bottom: 1px solid #ddd;">
                            <td style="padding: 10px;">${cols[0] || ''}</td>
                            <td style="padding: 10px;"><strong>${cols[2] || ''}</strong></td>
                            <td style="padding: 10px;">${cols[3] || ''}</td>
                            <td style="padding: 10px;">${cols[6] || ''}</td>
                            <td style="padding: 10px;"><span class="badge bg-default">${cols[7] || ''}</span></td>
                            <td style="padding: 10px;">${cols[10] || ''}</td>
                        </tr>`;
                    }
                }
                if(!hayRegistros) htmlHistorial = '<tr><td colspan="6" style="text-align:center; padding: 20px;">No hay registros de trazabilidad.</td></tr>';
                document.getElementById('cuerpo-historial').innerHTML = htmlHistorial;
            } catch(e) { document.getElementById('cuerpo-historial').innerHTML = '<tr><td colspan="6" style="text-align:center; color:red; padding: 20px;">Error al cargar.</td></tr>'; }
        }
    </script>
</body>
</html>
