<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario TI - Servialco</title>
    <!-- Aquí conectamos el diseño externo -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="logo-servialco.png" alt="Logo Servialco" onerror="this.style.display='none'">
            <h1>Inventario TI - GitOps</h1>
        </div>
        <button class="btn-accion" onclick="abrirModal()">+ Actualizar Bitácora</button>
    </div>

    <div class="search-container">
        <input type="text" id="buscador" class="buscador" onkeyup="filtrarTabla()" placeholder="Buscar equipo, serial o responsable...">
        <select id="filtro-estado" class="filtro-estado" onchange="filtrarTabla()">
            <option value="">Todos los Estados</option>
            <option value="ASIGNADO">Asignados</option>
            <option value="BODEGA">En Bodega</option>
            <option value="DEVUELTO">Devueltos a Proveedor</option>
            <option value="SOPORTE">En Soporte</option>
        </select>
    </div>

    <div class="tabs" id="tabs-container">
        <button class="tab-btn active" onclick="filtrarPorPestana('TODOS', this)">TODOS LOS EQUIPOS</button>
    </div>

    <div style="overflow-x:auto; max-height: 70vh; overflow-y: auto;">
        <table id="tablaInventario">
            <thead><tr id="filas-cabecera"></tr></thead>
            <tbody id="cuerpo-tabla"></tbody>
        </table>
    </div>

    <!-- MODAL 1: FORMULARIO BITÁCORA -->
    <div id="miModal" class="modal">
        <div class="modal-content" style="width: 50%; max-width: 650px;">
            <div class="modal-header">Registrar Evento en Bitácora</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Serial del Equipo (Llave)*</label>
                    <input type="text" id="m-serial" placeholder="Ej: 5CG416681G" required>
                </div>
                <div class="form-group">
                    <label>Tipo de Evento*</label>
                    <select id="m-evento" onchange="ajustarFormulario()">
                        <option value="CAMBIO_USUARIO">Cambio de Responsable</option>
                        <option value="CREACION_NUEVO">Ingreso Equipo Nuevo</option>
                        <option value="DEVOLUCION_PROVEEDOR">Devolución Proveedor</option>
                        <option value="REPARACION">Reparación/Soporte</option>
                    </select>
                </div>
                <div class="form-group"><label>Nuevo Responsable</label><input type="text" id="m-resp"></div>
                <div class="form-group"><label>Nueva Área</label><input type="text" id="m-area"></div>
                <div class="form-group"><label>Nuevo Cargo</label><input type="text" id="m-cargo"></div>
                <div class="form-group"><label>Nueva Ubicación</label><input type="text" id="m-ubic"></div>
                <div class="form-group">
                    <label>Nuevo Estado</label>
                    <select id="m-estado">
                        <option value="ASIGNADO">ASIGNADO</option>
                        <option value="BODEGA">BODEGA</option>
                        <option value="DEVUELTO">DEVUELTO PROVEEDOR</option>
                        <option value="SOPORTE">EN SOPORTE</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Empresa (Pestaña destino)*</label>
                    <select id="m-empresa">
                        <option value="AYS,CONSTRUSALCO">AYS - CONSTRUSALCO</option>
                        <option value="PROPIO,SERVIALCO">PROPIO - SERVIALCO</option>
                        <option value="UNICAT,UNICAT">UNICAT - UNICAT</option>
                        <option value="AYS,SERVIALCO">AYS - SERVIALCO</option>
                        <option value="ARKY,ARKY">ARKY - ARKY</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="margin-top:15px; width:100%;">
                <label>Observaciones</label>
                <input type="text" id="m-obs" placeholder="Motivo del evento...">
            </div>
            <div class="modal-footer">
                <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-accion" onclick="guardarEnGitHub()">💾 Guardar Evento</button>
            </div>
        </div>
    </div>

    <!-- MODAL 2: HISTORIAL DE CAMBIOS -->
    <div id="modalHistorial" class="modal">
        <div class="modal-content" style="width: 80%; max-width: 900px;">
            <div class="modal-header">Trazabilidad del Equipo: <span id="historial-serial" style="color:#70C457;"></span></div>
            <div style="overflow-x:auto; max-height: 400px; overflow-y: auto;">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr>
                            <th style="background-color:#A8D5E8; color:#333;">Fecha</th>
                            <th style="background-color:#A8D5E8; color:#333;">Evento</th>
                            <th style="background-color:#A8D5E8; color:#333;">Responsable</th>
                            <th style="background-color:#A8D5E8; color:#333;">Ubicación</th>
                            <th style="background-color:#A8D5E8; color:#333;">Estado</th>
                            <th style="background-color:#A8D5E8; color:#333;">Observaciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-historial"></tbody>
                </table>
            </div>
            <div class="modal-footer">
                <button class="btn-cancelar" onclick="cerrarHistorial()">Cerrar Historial</button>
            </div>
        </div>
    </div>

    <!-- EL ?v=2 OBLIGA AL NAVEGADOR A CARGAR LA VERSIÓN CORREGIDA -->
    <script src="bitacora.js?v=2"></script>

</body>
</html>
